steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/omnicreator-studio:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/omnicreator-studio:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/omnicreator-studio:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'omnicreator-studio'
      - '--image=gcr.io/$PROJECT_ID/omnicreator-studio:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--port=8080'
images:
  - 'gcr.io/$PROJECT_ID/omnicreator-studio:latest'
