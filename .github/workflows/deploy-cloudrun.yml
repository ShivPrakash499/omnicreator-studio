name: Deploy OmniCreator Studio to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SERVICE_NAME: omnicreator-studio
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy to Cloud Run from Source
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          flags: '--allow-unauthenticated --memory=2Gi --cpu=2'
